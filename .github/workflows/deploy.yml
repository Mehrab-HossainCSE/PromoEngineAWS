# =============================================================================
# PromoEngine - build, publish and deploy
#
#   push to main
#        |
#        +--> build backend image  --+
#        +--> build frontend image --+--> push both to Docker Hub
#                                     |
#                                     +--> SSH to EC2 -> pull -> compose up -> verify
#
# Configuration reaches the host from two places:
#
#   1. The repository's own .env - non-secret deployment tunables only: tenant
#      database prefix, published port, log level. Committed, so it is
#      version-controlled alongside the code.
#   2. These seven GitHub secrets, none of which is ever committed:
#
#   DOCKER_USERNAME   - Docker Hub login, image namespace, and DOCKER_USERNAME
#                       in the server env file (docker-compose.yml reads it to
#                       resolve the image names).
#   DOCKER_PASSWORD   - Docker Hub access token. Used to log in on the runner
#                       (to push) and on EC2 (to pull).
#   AWS_HOST          - EC2 public DNS or IP: the SSH target, and the origin
#                       used for the CORS allow-list.
#   AWS_USER          - EC2 login user (ec2-user on Amazon Linux, ubuntu on Ubuntu).
#   AWS_KEY           - private half of the EC2 key pair, PEM.
#   POSTGRES_DB       - control-plane catalog database name. Becomes POSTGRES_DB
#                       on the postgres container and Database= in
#                       ConnectionStrings__Catalog.
#   POSTGRES_PASSWORD - PostgreSQL superuser password. Becomes POSTGRES_PASSWORD
#                       on the postgres container and Password= in BOTH the
#                       catalog and the tenant-provisioning connection strings.
#
# Three more concern only the monitoring stack:
#
#   GRAFANA_USER              - Grafana admin login name. REQUIRED while
#                               MONITORING_ENABLED=true in .env.
#   GRAFANA_PASSWORD          - Grafana admin password. REQUIRED likewise.
#                               deploy.sh applies both to Grafana on every
#                               deploy, so changing a secret and pushing changes
#                               the login - there is nothing to set on the host.
#   GRAFANA_ALERT_WEBHOOK_URL - OPTIONAL. A Slack/Teams/on-call incoming webhook.
#                               If absent, alerts still fire and show in Grafana;
#                               they are simply not sent anywhere.
#
# The two files are copied separately and merged by deploy.sh, secrets last, so
# a secret always wins over a committed value. No secret is ever echoed: GitHub
# masks them in the log, and the file travels over the encrypted SSH channel.
# =============================================================================

name: Deploy PromoEngine

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys running at once would race on the same .env and the same
# containers. Queue them instead, and never cancel a deploy midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: promoengine-backend
  FRONTEND_IMAGE: promoengine-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Build both images in parallel and push them to Docker Hub.
  # ---------------------------------------------------------------------------
  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: PromoBackend
            dockerfile: PromoBackend/Dockerfile
            image: promoengine-backend
          - name: frontend
            context: PromoFrontend
            dockerfile: PromoFrontend/Dockerfile
            image: promoengine-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx enables the registry/GitHub layer cache used below, which is what
      # keeps a no-dependency-change build to roughly a minute.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Two tags per image:
      #   :latest        - what the server pulls by default
      #   :<commit sha>  - immutable, so a rollback is exact and a running
      #                    container can always be traced to a commit
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error=true is not optional here, it is the point.
          #
          # A layer cache is an optimisation. It must never be able to fail a
          # build, and without this flag it can: GitHub caps the Actions cache at
          # 10 GB per repository and evicts least-recently-used entries when you
          # cross it. mode=max exports every intermediate stage - for the backend
          # that means the .NET SDK build layers, which are large - so an export
          # can have blobs evicted out from under it while it is still running.
          # BuildKit then reports "error writing layer blob: not_found" and the
          # whole job fails, after the image has already been built and pushed.
          #
          # With this flag a cache export failure is a warning: the next build is
          # slower, and nothing else changes.
          cache-to: type=gha,scope=${{ matrix.name }},mode=max,ignore-error=true

  # ---------------------------------------------------------------------------
  # Check the monitoring configuration before any of it reaches the host.
  #
  # These files are consumed by six containers that each fail in their own way,
  # and several of those failures are quiet - Prometheus refuses to start on a
  # bad scrape config, but Grafana logs a provisioning error and carries on
  # serving empty dashboards. Thirty seconds here is worth more than reading
  # container logs over SSH afterwards.
  #
  # Runs in parallel with the image builds and gates the deploy, so a typo in a
  # dashboard cannot reach production.
  # ---------------------------------------------------------------------------
  validate-monitoring:
    name: Validate monitoring configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # promtool is the Prometheus project's own checker: it parses the scrape
      # config exactly as the server would, so a pass here means the server will
      # start. Pinned to the same version as the deployed image.
      - name: Check the Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/cfg:ro" \
            prom/prometheus:v3.13.3-busybox check config /cfg/prometheus.yml

      # Alloy's own linter. Its configuration language is not YAML, so nothing
      # else can validate it - and a syntax error there means no logs at all,
      # with the application looking perfectly healthy.
      - name: Check the Alloy configuration
        run: |
          docker run --rm --entrypoint /bin/alloy \
            -v "${PWD}/monitoring/alloy:/cfg:ro" \
            grafana/alloy:v1.19.2 fmt /cfg/config.alloy > /dev/null

      # Loki has no offline validator, so the check is structural: valid YAML
      # with the handful of sections whose absence silently changes behaviour.
      # retention without a compactor is the classic one - it deletes nothing,
      # and the disk fills anyway.
      - name: Check the Loki and Grafana configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml

          errors = []

          loki = yaml.safe_load(pathlib.Path("monitoring/loki/loki-config.yml").read_text())
          for section in ("schema_config", "storage_config", "limits_config", "compactor"):
              if section not in loki:
                  errors.append(f"loki-config.yml is missing the {section} section")
          if loki.get("compactor", {}).get("retention_enabled") is not True:
              errors.append("loki-config.yml sets a retention period but no compactor to enforce it")

          # Every dashboard must be valid JSON, carry a stable uid, and point
          # only at data sources that are actually provisioned.
          provisioned = set()
          ds = yaml.safe_load(pathlib.Path(
              "monitoring/grafana/provisioning/datasources/datasources.yml").read_text())
          for entry in ds.get("datasources", []):
              provisioned.add(entry["uid"])

          uids = {}
          for path in sorted(pathlib.Path("monitoring/grafana/dashboards").glob("*.json")):
              try:
                  board = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  errors.append(f"{path}: invalid JSON - {exc}")
                  continue
              if not board.get("uid"):
                  errors.append(f"{path}: no uid, so a redeploy would duplicate it")
              if board["uid"] in uids:
                  errors.append(f"{path}: uid collides with {uids[board['uid']]}")
              uids[board["uid"]] = path
              for panel in board.get("panels", []):
                  for target in panel.get("targets", []):
                      uid = target.get("datasource", {}).get("uid")
                      if uid and uid not in provisioned:
                          errors.append(
                              f"{path}: panel '{panel.get('title')}' uses "
                              f"datasource '{uid}', which is not provisioned")

          # Alert rules: the condition must name a refId the rule actually has,
          # which is the one mistake that provisions cleanly and then never fires.
          rules = yaml.safe_load(pathlib.Path(
              "monitoring/grafana/provisioning/alerting/rules.yml").read_text())
          seen = set()
          count = 0
          for group in rules.get("groups", []):
              for rule in group.get("rules", []):
                  count += 1
                  refs = {q["refId"] for q in rule["data"]}
                  if rule["condition"] not in refs:
                      errors.append(f"{rule['uid']}: condition '{rule['condition']}' is not one of {sorted(refs)}")
                  if rule["uid"] in seen:
                      errors.append(f"{rule['uid']}: duplicate alert uid")
                  seen.add(rule["uid"])
                  for query in rule["data"]:
                      if query["datasourceUid"] not in provisioned | {"__expr__"}:
                          errors.append(f"{rule['uid']}: unknown datasource {query['datasourceUid']}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"{len(uids)} dashboards, {count} alert rules, "
                f"datasources {sorted(provisioned)} - all consistent")
          PY

      # The two files have to merge into one valid project. This catches the
      # class of mistake that only appears when both are passed together - a
      # network declared twice with conflicting settings, a service name reused,
      # a variable referenced but never defined.
      - name: Check the merged Compose project
        run: |
          # Placeholder values only: `config` interpolates variables, and the
          # point of this step is the structure, not the secrets. Nothing here
          # reaches the host.
          cat > .env.validate <<'ENV'
          POSTGRES_PASSWORD=validation-only
          POSTGRES_DB=validation-only
          DOCKER_USERNAME=validation-only
          JWT_SIGNING_KEY=validation-only
          EXTERNAL_API_KEY=validation-only
          GRAFANA_ADMIN_USER=validation-only
          GRAFANA_ADMIN_PASSWORD=validation-only
          ENV

          docker compose --env-file .env.validate --env-file .env \
            -f docker-compose.yml -f docker-compose.monitoring.yml \
            config --quiet

          echo "Services in the merged project:"
          docker compose --env-file .env.validate --env-file .env \
            -f docker-compose.yml -f docker-compose.monitoring.yml \
            config --services | sed 's/^/  /'

          rm -f .env.validate

  # ---------------------------------------------------------------------------
  # Deploy to EC2. Only runs once both images are in the registry, so the host
  # never pulls a half-published release.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build, validate-monitoring]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The private key is written to a file rather than passed on a command
      # line, so it never appears in a process list on the runner.
      - name: Configure SSH
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          mkdir -p ~/.ssh

          # `tr -d '\r'` is not decoration. A .pem copied on Windows carries
          # CRLF line endings, and OpenSSH rejects a private key whose lines end
          # in CR - reporting it as "error in libcrypto" or, once ssh falls back
          # to offering nothing, as a plain "Permission denied (publickey)".
          # Stripping CR here makes a Windows-copied key work unchanged.
          printf '%s\n' "$AWS_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A truncated paste is the other frequent cause, and it is worth a
          # specific message rather than letting ssh-keygen speak for it.
          if ! head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN'; then
            echo "::error::AWS_KEY does not start with a -----BEGIN line."
            echo "  The secret must hold the whole .pem file. Copy it with"
            echo "  'cat your-key.pem' and select everything, markers included."
            exit 1
          fi

          # Validate the key before using it. "Permission denied (publickey)"
          # from ssh is the same message whether the key is malformed, is the
          # wrong key, or the username is wrong - so rule out the first case
          # here, where the error can be specific.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2> /tmp/keyerr; then
            echo "::error::The AWS_KEY secret is not a usable OpenSSH private key."
            sed 's/^/  ssh-keygen: /' /tmp/keyerr
            echo "  Check that the secret holds the ENTIRE .pem file, including the"
            echo "  -----BEGIN ...----- and -----END ...----- lines, with no extra"
            echo "  indentation. A PuTTY .ppk file will not work: convert it first"
            echo "  with 'puttygen key.ppk -O private-openssh -o key.pem'."
            exit 1
          fi

          # The fingerprint and public key are not secret, and printing them is
          # what turns an auth failure into a five-second diagnosis: compare
          # this against ~/.ssh/authorized_keys on the instance.
          echo "Deployment key parsed successfully:"
          ssh-keygen -l -f ~/.ssh/deploy_key.pub
          echo ""
          echo "Public half of AWS_KEY (must appear in authorized_keys on the EC2 host):"
          cat ~/.ssh/deploy_key.pub

          # Trust on first use. To pin instead, store the output of
          # `ssh-keyscan <host>` as a secret and write it here.
          #
          # Retried, because an instance that was just started or rebooted
          # accepts no connections for the minute or two before sshd is up. And
          # checked, because ssh-keyscan failing is the FIRST sign that AWS_HOST
          # is unreachable - without a message, the step just ends in a bare
          # "exit code 1" right after the key parsed successfully.
          touch ~/.ssh/known_hosts
          scanned=0
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null                && [ -s ~/.ssh/known_hosts ]; then
              scanned=1
              break
            fi
            echo "No SSH host key from AWS_HOST yet (attempt ${attempt}/6); retrying in 15s."
            sleep 15
          done
          chmod 644 ~/.ssh/known_hosts

          if [ "$scanned" -ne 1 ]; then
            echo "::error::Could not reach SSH on AWS_HOST after about 2 minutes."
            echo "  The deploy key is fine - it parsed above. The host did not answer on port 22."
            echo "  Check the instance in the EC2 console:"
            echo "   1. Instance state is 'Running' (not Stopped / Stopping / Pending)."
            echo "   2. Its Public IPv4 address still matches the AWS_HOST secret. Stopping and"
            echo "      starting an instance without an Elastic IP gives it a NEW public IP."
            echo "   3. Status checks read '2/2 checks passed'. A failed instance check means"
            echo "      the OS is hung - reboot it from the console."
            echo "   4. The security group still allows inbound TCP 22."
            echo "  AWS_HOST is currently ${#AWS_HOST} characters long."
            exit 1
          fi

      # Only the values that genuinely come from GitHub secrets are assembled
      # here. Database configuration lives in the repository's own .env, copied
      # across in the next step, and deploy.sh layers this file on top of it.
      #
      # GitHub masks every secret in the log, and the file travels over the
      # encrypted SSH channel. deploy.sh deletes it once merged.
      - name: Assemble secret overlay
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAFANA_ALERT_WEBHOOK_URL: ${{ secrets.GRAFANA_ALERT_WEBHOOK_URL }}
        run: |
          umask 077
          {
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}"
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "PUBLIC_ORIGIN=http://${AWS_HOST}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"

            # The Grafana login. Renamed on the way through: docker-compose and
            # deploy.sh call these GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD.
            echo "GRAFANA_ADMIN_USER=${GRAFANA_USER}"
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASSWORD}"

            # Optional. deploy.sh skips empty values when merging.
            echo "GRAFANA_ALERT_WEBHOOK_URL=${GRAFANA_ALERT_WEBHOOK_URL}"
          } > env.ci
          echo "Wrote the secret overlay with $(wc -l < env.ci) settings."

          # Fail here, with a readable message, rather than 40 seconds later on
          # the EC2 host. An unset secret expands to an empty string, and the
          # merge on the host skips empty values, so the symptom would
          # otherwise be a confusing "POSTGRES_PASSWORD is not set" from a file
          # the pipeline just wrote.
          missing=""
          [ -n "${POSTGRES_PASSWORD}" ] || missing="${missing} POSTGRES_PASSWORD"
          [ -n "${POSTGRES_DB}" ]       || missing="${missing} POSTGRES_DB"
          [ -n "${DOCKER_USERNAME}" ]   || missing="${missing} DOCKER_USERNAME"

          # The Grafana login is only needed when the monitoring overlay is on,
          # and whether it is on is decided by the committed .env.
          if grep -qx 'MONITORING_ENABLED=true' .env; then
            [ -n "${GRAFANA_USER}" ]     || missing="${missing} GRAFANA_USER"
            [ -n "${GRAFANA_PASSWORD}" ] || missing="${missing} GRAFANA_PASSWORD"
          fi

          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secret(s):${missing} - add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if grep -qx 'MONITORING_ENABLED=true' .env; then
            # A login name goes into a curl credential and a JSON body on the
            # host. Plain characters only keeps both unambiguous.
            case "${GRAFANA_USER}" in
              *[!A-Za-z0-9._@-]*)
                echo "::error::GRAFANA_USER may contain only letters, digits, '.', '_', '-' and '@'."
                exit 1
                ;;
            esac

            # Same rule as POSTGRES_PASSWORD: Compose expands \$NAME when it reads
            # .env, so Grafana would be created with a different password than
            # the secret holds.
            case "${GRAFANA_PASSWORD}" in
              *'$'*)
                echo "::error::GRAFANA_PASSWORD contains a '\$' character, which Docker Compose would rewrite. Choose one without '\$'."
                exit 1
                ;;
              \"*|\'*)
                echo "::error::GRAFANA_PASSWORD starts with a quote, which the .env parser would strip. Choose one that does not."
                exit 1
                ;;
            esac

            # Grafana serves over plain HTTP here and is published on the public
            # interface, so this password is the whole of its protection.
            if [ "${#GRAFANA_PASSWORD}" -lt 12 ]; then
              echo "::error::GRAFANA_PASSWORD is only ${#GRAFANA_PASSWORD} characters; use at least 12."
              echo "  Grafana can read every metric and log line in the stack. Generate one with:"
              echo "    openssl rand -base64 24 | tr -d '/+='"
              exit 1
            fi
            echo "GRAFANA_USER is ${#GRAFANA_USER} characters; GRAFANA_PASSWORD is ${#GRAFANA_PASSWORD} characters."
          fi

          # Shape checks on POSTGRES_PASSWORD. The value is never echoed - only
          # facts about it are - so nothing sensitive reaches the log.
          #
          # A '$' would be re-interpreted by Compose when it interpolates .env,
          # so the password the container receives would differ from the secret.
          # That is a hard failure: it produces an authentication error hours
          # later that looks nothing like its cause.
          case "${POSTGRES_PASSWORD}" in
            *'$'*)
              echo "::error::POSTGRES_PASSWORD contains a '\$' character."
              echo "  Docker Compose expands \$NAME when it reads the env file, so the"
              echo "  database would be created with a different password than the secret"
              echo "  holds. Regenerate it without '\$'."
              exit 1
              ;;
          esac

          # A password containing a pipe or the word 'openssl' is almost always
          # the generator command pasted in as literal text instead of its
          # output. It would 'work', but the password would be a publicly known
          # string.
          case "${POSTGRES_PASSWORD}" in
            *'|'*|*openssl*)
              echo "::warning::POSTGRES_PASSWORD looks like a shell command rather than a generated password."
              echo "  If you pasted the generator command itself, run it first and store"
              echo "  its OUTPUT as the secret:"
              echo "    openssl rand -base64 32 | tr -d '/+=' | cut -c1-32"
              echo "  Note that changing it later does NOT change the password inside an"
              echo "  existing PostgreSQL volume - see DEPLOYMENT.md section 3."
              ;;
          esac

          # A weak password is the operator's call, but it is worth being loud
          # about the timing: PostgreSQL fixes the password at initdb, so once
          # the volume exists, changing this secret no longer changes anything.
          # The cheap moment to fix it is before the first successful deploy.
          if [ "${#POSTGRES_PASSWORD}" -lt 12 ]; then
            echo "::warning::POSTGRES_PASSWORD is only ${#POSTGRES_PASSWORD} characters."
            echo "  The deploy will proceed. Two things to know:"
            echo "  1. PostgreSQL is not published to the host and has no security-group"
            echo "     rule, so it is reachable only from inside the Docker network."
            echo "     A weak password here is not directly exposed to the internet."
            echo "  2. The password is fixed when the data directory is first created."
            echo "     After the first successful deploy, changing this secret has no"
            echo "     effect without an ALTER USER on the running server plus a rewrite"
            echo "     of the stored tenant connection strings (DEPLOYMENT.md section 3)."
            echo "  Change it now if you are going to change it at all."
          fi

          # Length is a fact about the secret, not the secret.
          echo "POSTGRES_DB is ${#POSTGRES_DB} characters; POSTGRES_PASSWORD is ${#POSTGRES_PASSWORD} characters."

          # AWS_HOST has to be reachable from two places that are not this
          # runner: the GitHub-hosted runner itself, and a user's browser. A
          # private VPC address satisfies neither, and an EC2 instance shows its
          # private name prominently in the console, so it is an easy mistake.
          # It also becomes the CORS origin, so a wrong value here breaks the
          # browser long after SSH has succeeded.
          case "${AWS_HOST}" in
            *.internal|*.internal.*|localhost|127.*|10.*|192.168.*|            172.1[6-9].*|172.2[0-9].*|172.3[01].*)
              echo "::error::AWS_HOST is a private address that GitHub Actions cannot reach."
              echo "  Values like ip-172-31-46-212.eu-north-1.compute.internal are the"
              echo "  instance's PRIVATE DNS name, routable only inside your VPC."
              echo "  Use the Public IPv4 address, or the Public IPv4 DNS name, from the"
              echo "  EC2 console instance summary."
              echo "  A public IPv4 address changes every time the instance is stopped and"
              echo "  started. Allocate an Elastic IP and associate it to pin it."
              exit 1
              ;;
          esac

      # Authentication is by far the most common first-deploy failure, and ssh
      # reports every cause with the same "Permission denied (publickey)". This
      # step separates them before any file is copied.
      - name: Verify SSH access
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                 "$AWS_USER@$AWS_HOST" "echo connected as \$(whoami) on \$(hostname)"; then
            exit 0
          fi

          echo "::error::SSH authentication to $AWS_HOST failed."
          echo ""
          echo "The connection reached sshd, so port 22 and the security group are fine."
          echo "That leaves three causes:"
          echo ""
          echo "  1. AWS_USER does not match the AMI. Amazon Linux uses 'ec2-user',"
          echo "     Ubuntu uses 'ubuntu', Debian 'admin', RHEL 'ec2-user'."
          echo "     AWS_USER is currently ${#AWS_USER} characters long."
          echo "  2. The instance was launched with a different key pair than AWS_KEY."
          echo "     Compare the fingerprint printed above with the key pair shown on"
          echo "     the instance in the EC2 console."
          echo "  3. The public half is missing from ~/.ssh/authorized_keys, or that"
          echo "     file has wrong permissions (it must be 600, and ~/.ssh 700)."
          echo ""
          echo "Verbose handshake follows - look for 'Authentications that can continue'"
          echo "and which key ssh offered:"
          ssh -vv -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              "$AWS_USER@$AWS_HOST" true 2>&1 | sed 's/^/  /' || true
          exit 1

      # A fresh EC2 instance has no Docker. Rather than failing and asking for a
      # manual step, the pipeline runs the same ec2-setup.sh that ships in the
      # repository. The script is idempotent: on an already-prepared host it
      # detects everything is present and does nothing.
      - name: Prepare the EC2 host
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/ec2-setup.sh "$AWS_USER@$AWS_HOST:~/ec2-setup.sh"

          # The version the host must have completed. Read from the script being
          # shipped, so the two can never disagree.
          setup_version=$(sed -n 's/^SETUP_VERSION=\([0-9][0-9]*\).*/\1/p' deploy/ec2-setup.sh | head -n 1)
          if [ -z "$setup_version" ]; then
            echo "::error::deploy/ec2-setup.sh has no SETUP_VERSION line."
            exit 1
          fi

          # First connection: decide whether preparation is needed, and do it.
          # The keepalives matter here and nowhere else in this workflow: a
          # Docker install on a fresh instance can sit quiet for minutes, long
          # enough for an idle NAT or security appliance to drop the session.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes               -o ServerAliveInterval=30 -o ServerAliveCountMax=20               "$AWS_USER@$AWS_HOST" "SETUP_VERSION_EXPECTED=$setup_version bash -s" <<'REMOTE'
          set -Eeuo pipefail

          needs_setup=0
          # The completion marker is the real test. The tool checks below can all
          # pass on a host where ec2-setup.sh died half way - Docker installed,
          # but the volume, network and daemon settings never applied.
          marker="$(cat /opt/promoengine/.host-prepared 2>/dev/null || true)"
          [ "$marker" = "$SETUP_VERSION_EXPECTED" ]     || needs_setup=1
          command -v docker > /dev/null 2>&1            || needs_setup=1
          docker compose version > /dev/null 2>&1       || needs_setup=1
          docker ps > /dev/null 2>&1                    || needs_setup=1
          [ -w /opt/promoengine ]                       || needs_setup=1

          if [ "$needs_setup" -eq 0 ]; then
            echo "Host already prepared (setup v$marker): $(docker --version), compose $(docker compose version --short)"
            exit 0
          fi

          # Everything below needs root. Without passwordless sudo the setup
          # script would block on a password prompt that nothing can answer, so
          # stop here with an explanation instead of hanging until SSH times out.
          if ! sudo -n true 2>/dev/null; then
            echo "::error::$(id -un) does not have passwordless sudo on this host."
            echo "  Installing Docker needs root, and a pipeline cannot answer a"
            echo "  password prompt. Either log in and run ec2-setup.sh by hand, or"
            echo "  restore passwordless sudo for this user. On a stock Ubuntu AMI"
            echo "  the 'ubuntu' user has it via /etc/sudoers.d/90-cloud-init-users."
            exit 1
          fi

          echo "Host is not ready yet - running ec2-setup.sh. This takes a few"
          echo "minutes on a fresh instance while Docker is installed."
          chmod +x ~/ec2-setup.sh
          ~/ec2-setup.sh
          REMOTE

          # Second connection, deliberately separate. `usermod -aG docker` only
          # takes effect for sessions started after it runs, so the check that
          # the deploy user can reach the daemon without sudo is only meaningful
          # in a brand-new login session.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
          set -u
          problems=0

          if ! command -v docker > /dev/null 2>&1; then
            echo "STILL MISSING: docker is not installed."
            problems=1
          elif ! docker ps > /dev/null 2>&1; then
            echo "STILL MISSING: $(id -un) cannot reach the Docker daemon without sudo."
            echo "               Check that the user is in the docker group: id -nG"
            problems=1
          fi

          if command -v docker > /dev/null 2>&1 && ! docker compose version > /dev/null 2>&1; then
            echo "STILL MISSING: the docker compose plugin is not installed."
            problems=1
          fi

          if [ "$problems" -ne 0 ]; then
            echo ""
            echo "Automatic preparation ran but did not leave the host usable."
            echo "Log in and run ./ec2-setup.sh manually to see the full output."
            exit 1
          fi

          echo "Host ready: $(docker --version), compose $(docker compose version --short)"
          REMOTE

      - name: Copy deployment files to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          # /opt is root-owned, so the directory is created with sudo and then
          # handed to the deploy user. Doing it here means a host that never had
          # ec2-setup.sh run still deploys, instead of failing on mkdir.
          ssh -i ~/.ssh/deploy_key "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR=/opt/promoengine

          if [ ! -d "$APP_DIR" ]; then
            sudo -n mkdir -p "$APP_DIR"
          fi

          # Take ownership if it is still root's, so every later step - scp
          # included - works without sudo.
          if [ ! -w "$APP_DIR" ]; then
            sudo -n chown "$(id -u):$(id -g)" "$APP_DIR"
          fi

          chmod 750 "$APP_DIR"
          REMOTE

          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            docker-compose.monitoring.yml \
            deploy/deploy.sh \
            "$AWS_USER@$AWS_HOST:/opt/promoengine/"

          # The monitoring tree: Prometheus scrape config, Loki config, the Alloy
          # pipeline, and Grafana's provisioning plus dashboards. All of it is
          # bind-mounted read-only into the containers, so this directory is the
          # live configuration - not a copy of it.
          #
          # -r to recurse. The rendered contact-points.yml, if the host has one,
          # is NOT in the repository and so is not overwritten by this: scp adds
          # and replaces, it does not mirror.
          scp -r -i ~/.ssh/deploy_key \
            monitoring \
            "$AWS_USER@$AWS_HOST:/opt/promoengine/"

          # The repository's configuration file and the secret overlay are sent
          # under distinct names so deploy.sh can merge them in a defined order
          # without either one clobbering the live file outright.
          scp -i ~/.ssh/deploy_key \
            .env "$AWS_USER@$AWS_HOST:/opt/promoengine/env.repo"

          scp -i ~/.ssh/deploy_key \
            env.ci "$AWS_USER@$AWS_HOST:/opt/promoengine/env.ci"

          ssh -i ~/.ssh/deploy_key "$AWS_USER@$AWS_HOST" \
            "chmod +x /opt/promoengine/deploy.sh && chmod 600 /opt/promoengine/env.repo /opt/promoengine/env.ci"

      # The remote script is fed over stdin to `bash -s`, so the Docker Hub
      # token never becomes a command-line argument visible in `ps` on EC2.
      # base64 keeps it safe from shell quoting regardless of what characters
      # the token contains.
      - name: Pull images and restart the stack
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          DOCKER_PASSWORD_B64=$(printf '%s' "$DOCKER_PASSWORD" | base64 -w0)

          ssh -i ~/.ssh/deploy_key "$AWS_USER@$AWS_HOST" 'bash -s' <<REMOTE
          set -Eeuo pipefail
          cd /opt/promoengine

          printf '%s' '${DOCKER_PASSWORD_B64}' | base64 -d | docker login --username '${DOCKER_USERNAME}' --password-stdin

          # deploy.sh merges .env.ci into .env, pulls, runs \`compose up -d\`,
          # waits for /health and prunes dangling images. It never removes a
          # volume, so tenant databases survive.
          ./deploy.sh

          # The credential file is not needed between deploys.
          docker logout
          REMOTE

      # deploy.sh verifies the monitoring pipeline but never fails on it - a
      # broken dashboard is not a reason to roll back a working application. It
      # leaves a marker file instead, and this step turns that into a build
      # annotation so the problem is visible without being fatal.
      - name: Report monitoring status
        if: always()
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          status=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$AWS_USER@$AWS_HOST" \
            'cat /opt/promoengine/.monitoring-status 2>/dev/null || echo ok') || status=unknown

          case "$status" in
            ok)
              echo "Monitoring verified: metrics and logs are both reaching Grafana."
              ;;
            degraded)
              echo "::warning::The application deployed successfully, but the monitoring stack is degraded."
              echo "  Metrics or logs are not reaching Grafana. The application is unaffected."
              echo "  On the host:"
              echo "    cd /opt/promoengine"
              echo "    docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps"
              echo "    docker compose -f docker-compose.yml -f docker-compose.monitoring.yml logs --tail 50 alloy prometheus"
              ;;
            *)
              echo "::notice::Could not read the monitoring status from the host."
              ;;
          esac

      # Independent confirmation from outside the host: if this passes, the
      # security group, Nginx, the API and PostgreSQL are all working together.
      - name: Verify deployment from the internet
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if response=$(curl --fail --silent --max-time 10 "http://${AWS_HOST}/health"); then
              echo "Health check passed: ${response}"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 10s."
            sleep 10
          done
          echo "::error::The deployed application did not answer /health from the public address."
          exit 1

      - name: Clean up runner credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key env.ci

      - name: Summary
        if: success()
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          {
            echo "### PromoEngine deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image tag | \`${GITHUB_SHA}\` |"
            echo "| URL | http://${AWS_HOST} |"
            echo ""
            echo "Tenant databases were preserved: the PostgreSQL volume \`promoengine-postgres-data\` is never removed by this pipeline."
            echo ""
            echo "#### Monitoring"
            echo ""
            if grep -qx 'GRAFANA_BIND_ADDRESS=127.0.0.1' .env; then
              echo "Grafana is on the instance's loopback interface only. Open it through an SSH tunnel:"
              echo ""
              echo '```'
              echo "ssh -i <your-key>.pem -L 3000:localhost:3000 ${AWS_USER}@${AWS_HOST}"
              echo '```'
              echo ""
              echo "then browse to <http://localhost:3000>."
            else
              echo "Grafana: <http://${AWS_HOST}:3000>"
            fi
            echo ""
            echo "Log in with the \`GRAFANA_USER\` and \`GRAFANA_PASSWORD\` repository secrets."
            echo "Dashboards: EC2 Host, Docker Containers, Backend API, Logs."
          } >> "$GITHUB_STEP_SUMMARY"
