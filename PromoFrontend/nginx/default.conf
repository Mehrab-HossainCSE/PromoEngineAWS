# =============================================================================
# PromoEngine frontend - Nginx server block
#
# This container is the only public entry point. It serves the compiled Angular
# bundle and reverse-proxies /api and /health to the backend container over the
# private Docker network, addressed by its service name.
#
# Because the browser therefore calls the API on its own origin, the Angular
# production build ships with apiUrl: '' and no CORS pre-flight is involved.
# =============================================================================

# "backend" is the Compose service name, resolved by Docker's embedded DNS on
# the promoengine network. Never localhost: inside this container localhost is
# Nginx itself.
upstream promo_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend caps spreadsheet uploads at 5 MB (ItemUpload:MaxFileBytes).
    # Nginx defaults to 1 MB, which would reject a valid upload with a 413
    # before the request ever reached .NET, so the proxy limit is set above it.
    client_max_body_size 10m;

    # ---- security headers -------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection         "0"              always;

    # ---- compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://promo_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Authorization must survive the hop: every tenant request carries the
        # JWT that TenantResolutionMiddleware reads to pick the tenant database.
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Excel exports stream out of ClosedXML; buffering them to disk first
        # only adds latency.
        proxy_buffering off;
    }

    # ---- backend health, proxied so the whole chain can be probed at once ---
    location = /health {
        proxy_pass         http://promo_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ---- Prometheus scrape endpoint: not for the public --------------------
    #
    # The backend serves /metrics, but only Prometheus should ever read it: it
    # exposes every route name, request volume and error count in the system.
    # Prometheus reaches it directly over the Docker network as backend:8080, so
    # it never needs to come through here.
    #
    # Without this block the SPA fallback below would return index.html for
    # /metrics - harmless, but it would also mean that adding /metrics/ to the
    # proxy one day would silently publish it. Refusing explicitly makes the
    # intent part of the configuration rather than an accident of ordering.
    location = /metrics {
        access_log off;
        return 404;
    }

    # ---- this container's own liveness, no backend involved ----------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- static assets -----------------------------------------------------
    # Angular fingerprints these filenames (outputHashing: all), so a far-future
    # cache is safe: a new build produces new names.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is the routing table for the SPA and must never be cached, or
    # a returning browser keeps loading the previous release's asset names.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---- SPA fallback ------------------------------------------------------
    # Angular routes are client-side, so any unmatched path returns index.html
    # and lets the router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
